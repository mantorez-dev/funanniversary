<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b1424">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Happy Anniversary! ❤️</title>

  <!-- Google Fonts: Romantic Cursive & Clean Modern Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==========================================================================
       SCREEN 1: THE INTRO SCREEN (Matching user's reference image)
       Couple photo with red tint, cursive title, and beating heart button
       ========================================================================== -->
  <section id="screen-intro" class="screen-intro active">
    <div class="intro-bg-wrapper">
      <img src="picture/intro_couple.jpg" alt="Our Anniversary" class="intro-bg-img">
      <div class="intro-red-overlay"></div>
    </div>

    <div class="intro-content">
      <h1 class="intro-title">Happy Anniversary!</h1>
      
      <div class="intro-heart-wrapper">
        <button id="btn-start-love" class="intro-heart-btn" aria-label="Click the heart">
          <span class="heart-icon">♥</span>
          <span class="heart-ring"></span>
        </button>
      </div>

      <p class="intro-subtitle">CLICK THE HEART</p>
    </div>
  </section>

  <!-- ==========================================================================
       SCREEN 2: THE HEART TREE & LOVE COUNTER SCREEN
       Tree with branches, flying hearts that form a heart canopy, photo fruits,
       live ticking time counter, and Letter button
       ========================================================================== -->
  <section id="screen-tree" class="screen-tree">
    
    <!-- Top Floating Quick Controls -->
    <header class="tree-top-bar">
      <!-- Fullscreen button (left red circle) -->
      <button class="top-icon-btn" id="btn-fullscreen" aria-label="Toggle Fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

      <!-- Music Toggle button (right red circle) -->
      <button class="top-icon-btn music-btn playing" id="btn-music-toggle" aria-label="Toggle Music" title="Music">
        <span class="music-icon" id="music-icon-symbol">❚❚</span>
      </button>
    </header>

    <!-- Canvas where Tree, Flying Heart Leaves, Falling Petals & Photo Fruits are rendered -->
    <canvas id="tree-canvas" class="tree-canvas"></canvas>

    <!-- The Time Counter & Letter Button Panel -->
    <div class="tree-info-panel" id="tree-info-panel">
      <!-- Floating Red Heart "Letter" Button -->
      <div class="letter-heart-box">
        <button id="btn-open-letter" class="letter-heart-btn" aria-label="Open Love Letter">
          <svg class="letter-heart-svg" viewBox="0 0 32 29.6" fill="#e63946">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
              c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
          </svg>
          <span class="letter-text">Letter</span>
        </button>
      </div>

      <!-- Live Counter -->
      <div class="time-counter-block">
        <span class="time-counter-header">Our time together...</span>
        <div class="time-counter-digits">
          <strong id="counter-days">--</strong> <small>days</small>
          <strong id="counter-hours">--</strong> <small>hours</small>
          <strong id="counter-mins">--</strong> <small>minutes</small>
          <strong id="counter-secs">--</strong> <small>seconds</small>
        </div>
      </div>

      <!-- Dotted Heart Trail & "Click here please" pointer -->
      <div class="continue-action-wrap">
        <div class="continue-heart-pointer">
          <span class="click-hint-text">Click here please ♡</span>
          <svg class="dotted-heart-svg" viewBox="0 0 100 48" fill="none">
            <!-- Dotted curved line that loops into a heart and points to button -->
            <path class="dotted-trail" d="M12,8 Q35,-4 50,14 C55,2 75,2 80,14 C85,26 65,36 50,44 L50,47" />
            <!-- Arrow tip pointing straight down at the button -->
            <polyline points="46,42 50,47 54,42" class="dotted-arrow-head" />
          </svg>
        </div>

        <button id="btn-continue-to-letter" class="btn-continue-pill">
          <span>Continue to Our Letter</span>
          <span class="continue-arrow">➔</span>
        </button>
      </div>
    </div>

    <!-- Tree Fruit Photo Hint -->
    <div class="tree-fruit-hint" id="tree-fruit-hint">
      <span>🍎 Tap any photo fruit on the tree!</span>
    </div>
  </section>

  <!-- ==========================================================================
       SCREEN 3: THE LOVE LETTER & 3D SPINNING PHOTO CAROUSEL
       Matching user's reference image 4:
       Pink card, typewriter message on left/top, 3D rotating cylinder of photos on right/bottom
       ========================================================================== -->
  <div id="modal-letter" class="modal-letter">
    <div class="letter-backdrop" id="letter-backdrop"></div>
    
    <div class="letter-card-container">
      <!-- Red Close Button (X) -->
      <button class="letter-close-btn" id="btn-close-letter" aria-label="Close Letter">✕</button>

      <div class="letter-card-grid">
        
        <!-- Left / Top: Vintage Paper Love Letter Sheet -->
        <div class="letter-typewriter-pane">
          <div class="letter-paper-sheet">
            <!-- Decorative Postage Stamp & Washi Tape -->
            <div class="paper-postage-stamp">
              <span class="stamp-heart">♥</span>
              <span class="stamp-date">03.05</span>
            </div>
            <div class="paper-washi-tape"></div>
            <div class="paper-margin-line"></div>

            <div id="typewriter-content" class="typewriter-content"></div>
            <span class="typewriter-cursor">|</span>
          </div>

          <div class="letter-controls">
            <button id="btn-replay-typewriter" class="btn-action-small">Replay Letter ↺</button>
          </div>
        </div>

        <!-- Right / Bottom: 3D Continuously Spinning Photo Carousel -->
        <div class="letter-carousel-pane">
          <div class="carousel-title-row">
            <span class="carousel-badge">Our Memories</span>
            <span class="carousel-hint">Spinning left to right · Tap to zoom</span>
          </div>

          <!-- 3D Carousel Stage -->
          <div class="carousel-3d-stage" id="carousel-3d-stage">
            <div class="carousel-3d-cylinder" id="carousel-cylinder">
              <!-- 14 Photos populated dynamically by JS -->
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Fullscreen Photo Zoom Modal -->
  <div id="photo-zoom-modal" class="photo-zoom-modal">
    <div class="zoom-backdrop" id="zoom-backdrop"></div>
    <div class="zoom-box">
      <button class="zoom-close" id="btn-zoom-close">✕</button>
      <img src="" alt="Memory" id="zoom-img" class="zoom-img">
      <p id="zoom-caption" class="zoom-caption"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
